[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-resource-drift-sentinel"
version = "0.2.0"
description = "Schema drift checks with incident memory and portable visual reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
drift-sentinel = "sentinel.__main__:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
