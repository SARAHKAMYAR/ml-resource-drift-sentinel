<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img"><title>architecture</title><rect x="0" y="0" width="1200" height="540" rx="14" fill="#0b1220"/><text x="48" y="50" fill="#38bdf8" font-size="14" font-family="Arial,sans-serif">ML RESOURCE DRIFT SENTINEL</text><text x="48" y="104" fill="#e2e8f0" font-size="32" font-family="Arial,sans-serif">From schema contract to reviewable evidence</text><text x="48" y="142" fill="#aebed4" font-size="18" font-family="Arial,sans-serif">Supported workflow · JSON exports in, incident context and reports out</text><rect x="48" y="200" width="222" height="210" rx="14" fill="#121e31"/><text x="66" y="239" fill="#38bdf8" font-size="14" font-family="Arial,sans-serif">01 / INPUT</text><text x="66" y="283" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Approved baseline</text><text x="66" y="319" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Current schema export</text><text x="66" y="355" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Optional upstream names</text><rect x="342" y="200" width="222" height="210" rx="14" fill="#121e31"/><text x="360" y="239" fill="#38bdf8" font-size="14" font-family="Arial,sans-serif">02 / COMPARE</text><text x="360" y="283" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Validate field types</text><text x="360" y="319" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Detect schema changes</text><text x="360" y="355" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Assign review severity</text><rect x="636" y="200" width="222" height="210" rx="14" fill="#121e31"/><text x="654" y="239" fill="#38bdf8" font-size="14" font-family="Arial,sans-serif">03 / REMEMBER</text><text x="654" y="283" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Dataset + baseline scope</text><text x="654" y="319" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Open / active / resolved</text><text x="654" y="355" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Count observed reopenings</text><rect x="930" y="200" width="222" height="210" rx="14" fill="#121e31"/><text x="948" y="239" fill="#38bdf8" font-size="14" font-family="Arial,sans-serif">04 / REPORT</text><text x="948" y="283" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Structured JSON</text><text x="948" y="319" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Portable HTML report</text><text x="948" y="355" fill="#e2e8f0" font-size="15" font-family="Arial,sans-serif">Optional pipeline exit code</text><path d="M283 301h43m-10-8 10 8-10 8" stroke="#38bdf8" fill="none" stroke-width="2"/><path d="M577 301h43m-10-8 10 8-10 8" stroke="#38bdf8" fill="none" stroke-width="2"/><path d="M871 301h43m-10-8 10 8-10 8" stroke="#38bdf8" fill="none" stroke-width="2"/><text x="48" y="466" fill="#aebed4" font-size="18" font-family="Arial,sans-serif">Single-writer local state · Lineage is investigation context, not causal attribution</text><text x="48" y="503" fill="#aebed4" font-size="16" font-family="Arial,sans-serif">Live DataHub integration is preserved as a historical prototype in legacy/.</text></svg>